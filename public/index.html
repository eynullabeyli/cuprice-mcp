<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuprice MCP Server</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fafafa; color: #0a0a0a; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { max-width: 480px; padding: 48px 24px; text-align: center; }
    .icon { width: 48px; height: 48px; background: #298558; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 24px; }
    .icon svg { width: 24px; height: 24px; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 15px; color: #6b7280; line-height: 1.6; margin-bottom: 24px; }
    .endpoint { background: #1e1e1e; color: #e6db74; font-family: "SF Mono", Monaco, monospace; font-size: 13px; padding: 12px 16px; border-radius: 8px; margin-bottom: 24px; }
    .endpoint span { color: #a6e22e; }
    .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .links a { font-size: 13px; font-weight: 500; color: #298558; text-decoration: none; padding: 8px 16px; border: 1px solid #d1d5db; border-radius: 6px; transition: all 0.15s; }
    .links a:hover { background: #298558; color: white; border-color: #298558; }
    .badge { display: inline-block; font-size: 11px; font-weight: 600; color: #298558; background: #e8f5ee; padding: 2px 8px; border-radius: 99px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
      </svg>
    </div>
    <div class="badge">v1.0.0</div>
    <h1>Cuprice MCP Server</h1>
    <p>Manage pricing projects from AI tools like Cursor, Claude Desktop, and Claude Code.</p>
    <div class="endpoint"><span>POST</span> /mcp</div>
    <div class="links">
      <a href="https://docs.cuprice.io/mcp">Documentation</a>
      <a href="https://cuprice.io">Cuprice</a>
    </div>
  </div>
</body>
</html>
